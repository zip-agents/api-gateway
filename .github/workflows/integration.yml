# The whole stack on a GitHub runner, on demand: check out every repository side by side,
# exactly as on a developer's machine, start it with `make up`, and smoke-test each
# service through the gateway. Use it before the first deployment, or to try a gateway
# change against particular service commits.
#
# Deliberately not run on pull requests, pushes or a schedule. Each repository's CI tests
# its own code against the contract, each deploy checks itself through the real gateway,
# and live-smoke.yml tests the deployed system nightly. A run here combines this commit
# with other repositories' commits, so its failures could belong to any of them.
#
# Needs repository variables CLAUDE_REPOSITORY, GROK_REPOSITORY and DSH_REPOSITORY
# (owner/name). For private repositories, a fine-grained read-only token in the secret
# REPOS_READ_TOKEN.
name: integration

on:
  workflow_dispatch:
    inputs:
      claude_ref:
        description: "claude commit, branch or tag"
        default: main
      grok_ref:
        description: "grok commit, branch or tag"
        default: main
      dsh_ref:
        description: "dsh commit, branch or tag"
        default: main

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stack:
    name: Compose stack and smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CLAUDE_REPOSITORY }}
          ref: ${{ inputs.claude_ref }}
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
          path: claude
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.GROK_REPOSITORY }}
          ref: ${{ inputs.grok_ref }}
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
          path: grok
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DSH_REPOSITORY }}
          ref: ${{ inputs.dsh_ref }}
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
          path: dsh-qwen3.8
      - name: The gateway serves the current contract
        run: scripts/sync-contract.sh --check
      - name: Local secrets
        run: make env
      - name: Build and start the stack (a service that isn't healthy is reported, not fatal)
        run: make up
      - name: Smoke tests through the gateway
        run: docker compose --profile test run --rm --build smoke
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
