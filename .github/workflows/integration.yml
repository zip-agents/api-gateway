# Cross-service integration: check out every repository side by side, exactly as on a
# developer's machine, run the stack with docker compose, and smoke-test each service
# through the gateway. Runs on platform changes, nightly (to catch a service repository
# breaking the others), and on demand.
#
# The gateway is part of this repository. Needs repository variables CLAUDE_REPOSITORY,
# GROK_REPOSITORY and, optionally, DSH_REPOSITORY (owner/name). For private repositories,
# a fine-grained read-only token in the secret REPOS_READ_TOKEN.
name: integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stack:
    name: Compose stack and smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CLAUDE_REPOSITORY }}
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
          path: claude
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.GROK_REPOSITORY }}
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
          path: grok
      - uses: actions/checkout@v7
        if: vars.DSH_REPOSITORY != ''
        with:
          repository: ${{ vars.DSH_REPOSITORY }}
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
          path: dsh-qwen3.8
      - name: The gateway serves the current contract
        run: scripts/sync-contract.sh --check
      - name: Local secrets and services under test
        run: |
          make env
          if [ -f dsh-qwen3.8/Dockerfile ]; then
            echo "COMPOSE_PROFILES=dsh" >> "$GITHUB_ENV"
            echo "SMOKE_SERVICES=claude,grok,dsh" >> "$GITHUB_ENV"
          fi
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke tests through the gateway
        run: docker compose --profile test run --rm --build smoke
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
